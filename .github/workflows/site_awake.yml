name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 5 hours (At minute 0 past every 6th hour)
    - cron: '0 */5 * * *'
  # Allows you to manually trigger the action from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sI https://labops-insights.streamlit.app/ | head -n 1
